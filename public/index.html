<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ncWOP — Online CAM</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">

  <!-- ── Header ── -->
  <header class="app-header">
    <div class="logo">nc<span>WOP</span></div>
    <div class="header-divider"></div>
    <div class="header-title">Neues Projekt</div>
    <div class="header-actions">
      <button class="btn btn-secondary btn-sm" id="btn-reset">Zurücksetzen</button>
      <button class="btn btn-primary btn-sm" id="btn-export" disabled>G-Code exportieren</button>
    </div>
  </header>

  <!-- ── Sidebar ── -->
  <aside class="sidebar" id="sidebar">
    <div class="resize-handle" id="sidebar-resize"></div>
    <button class="panel-toggle" id="sidebar-toggle" title="Panel ein-/ausblenden">‹</button>
    <div class="step-indicator">
      <div class="step active" id="step-1"><div class="step-num">1</div> Rohling</div>
      <div class="step-arrow">›</div>
      <div class="step" id="step-2"><div class="step-num">2</div> Operation</div>
      <div class="step-arrow">›</div>
      <div class="step" id="step-3"><div class="step-num">3</div> G-Code</div>
    </div>

    <div class="sidebar-section" id="section-blank">
      <div class="sidebar-label">Rohling</div>
      <div class="form-group">
        <div class="type-toggle" id="blank-type-toggle">
          <button class="active" data-type="box">Box</button>
          <button data-type="cylinder">Zylinder</button>
        </div>
      </div>
      <div id="blank-box-params">
        <div class="param-grid">
          <div class="form-group">
            <label class="form-label">Länge X</label>
            <div class="form-control-unit"><input type="number" id="blank-x" value="100" min="1"><span class="unit-badge">mm</span></div>
          </div>
          <div class="form-group">
            <label class="form-label">Breite Y</label>
            <div class="form-control-unit"><input type="number" id="blank-y" value="80" min="1"><span class="unit-badge">mm</span></div>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Höhe Z</label>
          <div class="form-control-unit"><input type="number" id="blank-z" value="30" min="1"><span class="unit-badge">mm</span></div>
        </div>
      </div>
      <div id="blank-cylinder-params" style="display:none">
        <div class="param-grid">
          <div class="form-group">
            <label class="form-label">Durchmesser</label>
            <div class="form-control-unit"><input type="number" id="blank-dia" value="80" min="1"><span class="unit-badge">mm</span></div>
          </div>
          <div class="form-group">
            <label class="form-label">Höhe</label>
            <div class="form-control-unit"><input type="number" id="blank-h" value="50" min="1"><span class="unit-badge">mm</span></div>
          </div>
        </div>
      </div>
      <button class="btn btn-primary btn-full" id="btn-create-blank">Rohling erstellen</button>
    </div>

    <div class="sidebar-section" id="section-ops" style="display:none">
      <div class="sidebar-label">Operationen</div>
      <div id="op-list"></div>
      <button class="btn btn-secondary btn-full" id="btn-add-op">+ Operation hinzufügen</button>
    </div>
  </aside>

  <!-- ── Main 3D Viewport ── -->
  <main class="main-viewport">
    <canvas id="three-canvas"></canvas>

    <!-- View buttons -->
    <div class="viewport-overlay">
      <button class="viewport-btn" id="btn-view-top" title="Draufsicht">⊤</button>
      <button class="viewport-btn" id="btn-view-iso" title="Isometrisch">◈</button>
      <button class="viewport-btn" id="btn-view-front" title="Vorderansicht">▣</button>
    </div>

    <!-- Simulation controls -->
    <div id="sim-controls" style="display:none; position:absolute; bottom:16px; left:50%; transform:translateX(-50%); background:white; border:1px solid #e2e4e9; border-radius:12px; padding:10px 16px; box-shadow:0 8px 32px rgba(0,0,0,0.10); flex-direction:column; gap:8px; min-width:300px;">
      <!-- Progress bar -->
      <div style="height:4px; background:#f0f1f4; border-radius:4px; overflow:hidden;">
        <div id="sim-progress" style="height:100%; width:0%; background:#0057ff; transition:width 0.05s;"></div>
      </div>
      <!-- Controls -->
      <div style="display:flex; align-items:center; justify-content:center; gap:6px;">
        <button class="btn btn-secondary btn-sm" id="btn-sim-start" title="Zum Anfang">⏮</button>
        <button class="btn btn-secondary btn-sm" id="btn-sim-stepback" title="Schritt zurück">⏪</button>
        <button class="btn btn-primary" id="btn-sim-play" style="width:40px; padding:0;">▶</button>
        <button class="btn btn-secondary btn-sm" id="btn-sim-stop" title="Stop">■</button>
        <button class="btn btn-secondary btn-sm" id="btn-sim-stepfwd" title="Schritt vor">⏩</button>
        <button class="btn btn-secondary btn-sm" id="btn-sim-end" title="Zum Ende">⏭</button>
      </div>
      <!-- Speed -->
      <div style="display:flex; align-items:center; gap:8px;">
        <span style="font-size:11px; color:#9398a5; white-space:nowrap;">Geschwindigkeit</span>
        <input type="range" id="sim-speed" min="1" max="15" value="3" style="flex:1; cursor:pointer;">
      </div>
    </div>

    <!-- Before/After toggle -->
    <div id="before-after-ctrl" style="display:none; position:absolute; top:16px; right:16px; background:white; border:1px solid #e2e4e9; border-radius:10px; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,0.07);">
      <div style="display:flex;">
        <button id="btn-show-before" onclick="Blank.showBefore(); this.style.background='#0057ff'; this.style.color='#fff'; document.getElementById('btn-show-after').style.background=''; document.getElementById('btn-show-after').style.color='';" style="border:none; padding:6px 14px; font-size:12px; font-weight:500; cursor:pointer; background:#0057ff; color:#fff; font-family:inherit;">Vorher</button>
        <button id="btn-show-after" onclick="Blank.showAfter(); this.style.background='#0057ff'; this.style.color='#fff'; document.getElementById('btn-show-before').style.background=''; document.getElementById('btn-show-before').style.color='';" style="border:none; padding:6px 14px; font-size:12px; font-weight:500; cursor:pointer; background:transparent; color:#5a5f6e; font-family:inherit;">Nachher</button>
      </div>
    </div>
  </main>

  <!-- ── Right Panel ── -->
  <aside class="right-panel" id="right-panel">
    <div class="resize-handle resize-handle-left" id="panel-resize"></div>
    <button class="panel-toggle panel-toggle-right" id="panel-toggle" title="Panel ein-/ausblenden">›</button>
    <div class="panel-header">Parameter</div>
    <div class="panel-body" id="panel-content" style="padding:0;">
      <p style="color:var(--text-3); font-size:13px;">Rohling definieren und Operation wählen.</p>
    </div>
  </aside>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="js/viewer.js"></script>
<script src="js/blank.js"></script>
<script src="js/simulation.js"></script>
<script src="js/operations.js"></script>
<script src="js/app.js"></script>

</body>
</html>
