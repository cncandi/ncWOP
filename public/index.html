<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ncWOP</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">

  <!-- Header -->
  <div id="header">
    <div id="logo">nc<span>WOP</span></div>
    <div id="project-name">Neues Projekt</div>
    <div id="header-right">
      <button class="btn btn-ghost" id="btn-reset">Zurücksetzen</button>
      <button class="btn btn-primary" id="btn-export" disabled>G-Code exportieren</button>
    </div>
  </div>

  <!-- Body -->
  <div id="body">

    <!-- Sidebar -->
    <div id="sidebar">
      <div id="tabs">
        <button class="tab active" data-tab="blank">Rohteil</button>
        <button class="tab" data-tab="ops">Operationen</button>
      </div>

      <!-- Rohteil tab -->
      <div id="tab-blank" class="tab-content">
        <div class="s-section">
          <div class="toggle-row">
            <button class="toggle-btn active" id="tb-box">Box</button>
            <button class="toggle-btn" id="tb-cyl">Zylinder</button>
          </div>
          <div id="blank-box">
            <div class="field-row"><label>Länge X</label>
              <div class="input-unit"><input type="number" id="bx" value="100" min="1"><span>mm</span></div>
            </div>
            <div class="field-row"><label>Breite Y</label>
              <div class="input-unit"><input type="number" id="by" value="80" min="1"><span>mm</span></div>
            </div>
            <div class="field-row"><label>Höhe Z</label>
              <div class="input-unit"><input type="number" id="bz" value="30" min="1"><span>mm</span></div>
            </div>
          </div>
          <div id="blank-cyl" style="display:none">
            <div class="field-row"><label>Durchmesser</label>
              <div class="input-unit"><input type="number" id="bd" value="80" min="1"><span>mm</span></div>
            </div>
            <div class="field-row"><label>Höhe</label>
              <div class="input-unit"><input type="number" id="bh" value="50" min="1"><span>mm</span></div>
            </div>
          </div>
          <button class="btn btn-primary btn-full" id="btn-blank">Rohteil erstellen</button>
        </div>
      </div>

      <!-- Operationen tab -->
      <div id="tab-ops" class="tab-content" style="display:none">
        <div class="s-section">
          <div id="op-tree"></div>
          <button class="btn btn-ghost btn-full" id="btn-add-op">+ Planfräsen hinzufügen</button>
        </div>
      </div>
    </div>

    <!-- Viewport -->
    <div id="viewport">
      <canvas id="canvas"></canvas>
      <div id="view-btns">
        <button class="view-btn" id="v-top">⊤</button>
        <button class="view-btn" id="v-iso">◈</button>
        <button class="view-btn" id="v-front">▣</button>
      </div>
      <div id="sim-bar" style="display:none">
        <div id="sim-prog-wrap"><div id="sim-prog"></div></div>
        <div id="sim-btns">
          <button class="sim-btn" id="s-start">⏮</button>
          <button class="sim-btn" id="s-back">⏪</button>
          <button class="sim-btn sim-primary" id="s-play">▶</button>
          <button class="sim-btn" id="s-stop">■</button>
          <button class="sim-btn" id="s-fwd">⏩</button>
          <button class="sim-btn" id="s-end">⏭</button>
          <span style="font-size:11px;color:#9398a5;margin-left:4px;">Geschw.</span>
          <input type="range" id="sim-speed" min="1" max="15" value="3">
        </div>
      </div>
    </div>

    <!-- Right panel -->
    <div id="panel">
      <div id="panel-head">Parameter</div>
      <div id="panel-body">
        <p class="hint">Rohteil erstellen und Operation wählen.</p>
      </div>
    </div>

  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="js/viewer.js"></script>
<script src="js/blank.js"></script>
<script src="js/simulation.js"></script>
<script src="js/operations.js"></script>
<script src="js/app.js"></script>
</body>
</html>
