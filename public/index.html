<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ncWOP</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">

  <!-- Header -->
  <div id="header">
    <div id="logo">nc<span>WOP</span></div>
    <div id="project-name">Neues Projekt</div>
    <div id="header-right">
      <button class="btn btn-ghost" id="btn-reset">Zurücksetzen</button>
      <button class="btn btn-primary" id="btn-export" disabled>G-Code exportieren</button>
    </div>
  </div>

  <!-- Body -->
  <div id="body">

    <!-- Sidebar -->
    <div id="sidebar">
      <div id="tabs">
        <button class="tab active" data-tab="blank">Rohteil</button>
        <button class="tab" data-tab="ops">Operationen</button>
      </div>

      <!-- Rohteil tab -->
      <div id="tab-blank" class="tab-content">
        <div class="s-section">
          <div class="toggle-row">
            <button class="toggle-btn active" id="tb-box">Box</button>
            <button class="toggle-btn" id="tb-cyl">Zylinder</button>
          </div>
          <div id="blank-box">
            <div class="field-row"><label>Länge X</label>
              <div class="input-unit"><input type="number" id="bx" value="100" min="1"><span>mm</span></div>
            </div>
            <div class="field-row"><label>Breite Y</label>
              <div class="input-unit"><input type="number" id="by" value="80" min="1"><span>mm</span></div>
            </div>
            <div class="field-row"><label>Höhe Z</label>
              <div class="input-unit"><input type="number" id="bz" value="30" min="1"><span>mm</span></div>
            </div>
          </div>
          <div id="blank-cyl" style="display:none">
            <div class="field-row"><label>Durchmesser</label>
              <div class="input-unit"><input type="number" id="bd" value="80" min="1"><span>mm</span></div>
            </div>
            <div class="field-row"><label>Höhe</label>
              <div class="input-unit"><input type="number" id="bh" value="50" min="1"><span>mm</span></div>
            </div>
          </div>
          <button class="btn btn-primary btn-full" id="btn-blank">Rohteil erstellen</button>
        </div>

        <div class="s-section">
          <div class="section-label">Nullpunkt</div>

          <!-- Visual picker: top/bottom toggle + 3x3 -->
          <div class="origin-z-toggle">
            <button class="toggle-btn active" id="oz-top">Oben</button>
            <button class="toggle-btn" id="oz-center">Mitte</button>
            <button class="toggle-btn" id="oz-bottom">Unten</button>
          </div>

          <div class="origin-picker" id="origin-picker">
            <!-- 3x3: back-left, back-center(hidden), back-right -->
            <!--       mid-left,  center,              mid-right  -->
            <!--       front-left,front-center(hidden),front-right-->
            <button class="op-dot" data-x="left"   data-y="back"  title="Links hinten"></button>
            <div class="op-spacer"></div>
            <button class="op-dot" data-x="right"  data-y="back"  title="Rechts hinten"></button>
            <div class="op-spacer"></div>
            <button class="op-dot op-center" data-x="center" data-y="center" title="Mitte"></button>
            <div class="op-spacer"></div>
            <button class="op-dot" data-x="left"   data-y="front" title="Links vorne"></button>
            <div class="op-spacer"></div>
            <button class="op-dot" data-x="right"  data-y="front" title="Rechts vorne"></button>
          </div>

          <div id="origin-label">Mitte</div>

          <!-- Offset XYZ -->
          <div class="section-label" style="margin-top:10px;">Versatz</div>
          <div class="field-row"><label>X Versatz</label>
            <div class="input-unit"><input type="number" id="origin-ox" value="0" step="0.1"><span>mm</span></div>
          </div>
          <div class="field-row"><label>Y Versatz</label>
            <div class="input-unit"><input type="number" id="origin-oy" value="0" step="0.1"><span>mm</span></div>
          </div>
          <div class="field-row"><label>Z Versatz</label>
            <div class="input-unit"><input type="number" id="origin-oz" value="0" step="0.1"><span>mm</span></div>
          </div>
